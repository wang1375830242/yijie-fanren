<header class="page-head">
  <div class="wrap">
    <p class="chapter-no">卷外 · 人间</p>
    <h1>留言板</h1>
    <p class="page-lede">
      走过一程，总有一句话想留给后来的人。这里的话对所有访客可见，请不要写真实姓名、住址或其他个人信息。
    </p>
  </div>
</header>

<main class="wrap gb-main">
  <section class="gb-form-panel" aria-labelledby="gbFormTitle">
    <div class="gb-form-head">
      <p class="gb-kicker">留一笔</p>
      <h2 id="gbFormTitle">写点什么</h2>
    </div>
    <form id="gbForm" class="gb-form">
      <label class="gb-label" for="gbName">称呼 <span>登录后使用账号名</span></label>
      <input id="gbName" name="name" type="text" maxlength="16" autocomplete="nickname" placeholder="无名">
      <label class="gb-label" for="gbText">留言 <span>最多 200 字</span></label>
      <textarea id="gbText" name="text" rows="5" maxlength="200" aria-describedby="gbCount" required placeholder="写下一句想留下的话。"></textarea>
      <div class="gb-form-foot">
        <span id="gbCount" class="gb-count">0 / 200</span>
        <button class="btn btn--primary" id="gbSubmit" type="submit">留 下</button>
      </div>
      <label class="gb-hp" hidden>网站 <input id="gbWebsite" name="website" type="text" tabindex="-1" autocomplete="off"></label>
    </form>
    <p class="gb-status" id="gbStatus" role="status" aria-live="polite">正在连接留言板…</p>
  </section>

  <section class="gb-list-panel" aria-labelledby="gbListTitle">
    <div class="gb-list-head">
      <div>
        <p class="gb-kicker">后来的人</p>
        <h2 id="gbListTitle">留言</h2>
      </div>
      <button class="btn btn--sm" id="gbRefresh" type="button">刷新</button>
    </div>
    <div class="gb-list" id="gbList"></div>
    <p class="gb-empty" id="gbEmpty" hidden>还没有人留下字。你可以做第一个。</p>
    <div class="gb-more">
      <button class="btn btn--sm" id="gbMore" type="button" hidden>再看一些</button>
    </div>
  </section>
</main>
